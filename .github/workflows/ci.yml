name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: CLANG_FORMAT=clang-format-18 scripts/format.sh --check

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [14, 18]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison ninja-build llvm-${{ matrix.llvm }}-dev \
            zlib1g-dev libzstd-dev libedit-dev libxml2-dev libffi-dev libncurses-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCOMPILE_DEMO=ON -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
